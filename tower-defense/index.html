<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense</title>
<style>
html,body{margin:0;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:8px}
canvas{background:#141830;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;touch-action:manipulation}
.bar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;justify-content:center;align-items:center}
button{background:#242a48;color:#fff;border:2px solid transparent;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}button.sel{border-color:#6c8cff;background:#2a3270}button.go{background:#6c8cff}
p{margin:4px;color:#8e94b8;font-size:13px;text-align:center}
</style></head><body>
<div class="bar" id="stats"></div>
<canvas id="c" width="640" height="400"></canvas>
<div class="bar">
<button id="t0" class="sel">🔫 Gun $50</button><button id="t1">❄️ Frost $75</button><button id="t2">💥 Cannon $120</button><button id="up">⬆ Upgrade</button><button id="sell">💰 Sell</button><button id="go" class="go">▶ Start wave</button>
</div>
<p>Pick a tower and click a green tile to build. Click a tower to select it for upgrade/sell. Don't let enemies reach the end!</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),T=40,COLS=16,ROWS=10;
const path=[[0,2],[5,2],[5,7],[10,7],[10,3],[13,3],[13,8],[15,8]];
const pts=[];path.forEach((p,i)=>{if(!i)return;const[a,b]=path[i-1];const dx=Math.sign(p[0]-a),dy=Math.sign(p[1]-b);let cx=a,cy=b;pts.push([cx,cy]);while(cx!==p[0]||cy!==p[1]){cx+=dx;cy+=dy;pts.push([cx,cy])}});
const onPath=new Set(pts.map(p=>p.join(',')));
const WP=[...new Map(pts.map(p=>[p.join(','),p])).values()].map(p=>({x:p[0]*T+T/2,y:p[1]*T+T/2}));
const TT=[{n:'Gun',cost:50,range:100,rate:25,dmg:8,col:'#6c8cff'},{n:'Frost',cost:75,range:90,rate:40,dmg:3,col:'#6cf0ff',slow:.5},{n:'Cannon',cost:120,range:120,rate:70,dmg:30,col:'#ff7a5c',splash:45}];
let towers,en,shots,gold,lives,wave,spawnQ,sp,state,pick=0,selT=null,hover=null,t=0;
function reset(){towers=[];en=[];shots=[];gold=150;lives=20;wave=0;spawnQ=[];sp=0;state='idle';selT=null;ui()}
function startWave(){if(state==='over'){reset();return}if(spawnQ.length||en.length)return;wave++;const n=6+wave*3;for(let i=0;i<n;i++){const big=wave>2&&i%5===4;spawnQ.push(big?{hp:60+wave*25,sp:.7,r:11,v:20+wave*3,col:'#c56cff'}:{hp:20+wave*10,sp:1.1+Math.min(.8,wave*.04),r:8,v:8+wave,col:'#ff5c7a'})}sp=0;state='run';ui()}
function ui(){document.getElementById('stats').textContent='💰 '+gold+'   ❤️ '+lives+'   🌊 Wave '+wave+(state==='over'?'   — GAME OVER (click Start to retry)':'')}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();hover=[Math.floor((e.clientX-r.left)*c.width/r.width/T),Math.floor((e.clientY-r.top)*c.height/r.height/T)]});
c.addEventListener('mouseleave',()=>hover=null);
c.addEventListener('click',e=>{if(state==='over')return;const r=c.getBoundingClientRect();const gx=Math.floor((e.clientX-r.left)*c.width/r.width/T),gy=Math.floor((e.clientY-r.top)*c.height/r.height/T);
  const ex=towers.find(t=>t.gx===gx&&t.gy===gy);if(ex){selT=ex;return}selT=null;
  if(onPath.has(gx+','+gy)||gx<0||gx>=COLS||gy<0||gy>=ROWS)return;const d=TT[pick];if(gold<d.cost)return;gold-=d.cost;towers.push({gx,gy,type:pick,lvl:1,cd:0,spent:d.cost});ui()});
['t0','t1','t2'].forEach((id,i)=>document.getElementById(id).onclick=()=>{pick=i;['t0','t1','t2'].forEach((k,j)=>document.getElementById(k).classList.toggle('sel',i===j))});
document.getElementById('go').onclick=startWave;
document.getElementById('up').onclick=()=>{if(!selT)return;const cost=Math.round(TT[selT.type].cost*.7*selT.lvl);if(gold>=cost&&selT.lvl<4){gold-=cost;selT.lvl++;selT.spent+=cost;ui()}};
document.getElementById('sell').onclick=()=>{if(!selT)return;gold+=Math.round(selT.spent*.6);towers=towers.filter(t=>t!==selT);selT=null;ui()};
function step(){
  if(state==='idle'||state==='over'){return}t++;
  if(spawnQ.length&&++sp>=40){sp=0;const e=spawnQ.shift();en.push({...e,maxhp:e.hp,i:0,x:WP[0].x,y:WP[0].y,slow:0})}
  en.forEach(e=>{const w=WP[e.i+1];if(!w){e.done=true;return}const dx=w.x-e.x,dy=w.y-e.y,d=Math.hypot(dx,dy),s=e.sp*(e.slow>0?.5:1);if(e.slow>0)e.slow--;if(d<=s){e.i++;e.x=w.x;e.y=w.y}else{e.x+=dx/d*s;e.y+=dy/d*s}});
  en.filter(e=>e.done).forEach(()=>{lives--});en=en.filter(e=>!e.done);
  if(lives<=0){lives=0;state='over';ui();return}
  towers.forEach(tw=>{const d=TT[tw.type];tw.cd--;if(tw.cd>0)return;const cx=tw.gx*T+T/2,cy=tw.gy*T+T/2,rg=d.range+(tw.lvl-1)*12;
    let tg=null,bi=-1;en.forEach(e=>{if(Math.hypot(e.x-cx,e.y-cy)<=rg&&e.i>bi){bi=e.i;tg=e}});
    if(tg){tw.cd=Math.max(8,d.rate-(tw.lvl-1)*4);shots.push({x:cx,y:cy,tg,d,dmg:d.dmg*(1+(tw.lvl-1)*.6)})}});
  shots.forEach(s=>{const e=s.tg;if(!en.includes(e)){s.dead=true;return}const dx=e.x-s.x,dy=e.y-s.y,dd=Math.hypot(dx,dy);if(dd<8){s.dead=true;
    if(s.d.splash)en.forEach(o=>{if(Math.hypot(o.x-e.x,o.y-e.y)<s.d.splash)o.hp-=s.dmg});else e.hp-=s.dmg;if(s.d.slow)e.slow=90}else{s.x+=dx/dd*7;s.y+=dy/dd*7}});
  shots=shots.filter(s=>!s.dead);
  en.forEach(e=>{if(e.hp<=0){e.dead=true;gold+=e.v}});if(en.some(e=>e.dead))ui();en=en.filter(e=>!e.dead);
  if(state==='run'&&!spawnQ.length&&!en.length){state='idle';gold+=20+wave*5;ui()}
}
function draw(){
  x.fillStyle='#141830';x.fillRect(0,0,640,400);
  for(let i=0;i<COLS;i++)for(let j=0;j<ROWS;j++){x.fillStyle=onPath.has(i+','+j)?'#4a3a2a':((i+j)%2?'#1a3a2a':'#1c4030');x.fillRect(i*T,j*T,T,T)}
  if(hover&&!onPath.has(hover.join(','))&&!towers.some(t=>t.gx===hover[0]&&t.gy===hover[1])){x.fillStyle='rgba(255,255,255,.15)';x.fillRect(hover[0]*T,hover[1]*T,T,T)}
  towers.forEach(tw=>{const d=TT[tw.type],cx=tw.gx*T+T/2,cy=tw.gy*T+T/2;if(tw===selT){x.strokeStyle='rgba(255,255,255,.5)';x.beginPath();x.arc(cx,cy,d.range+(tw.lvl-1)*12,0,7);x.stroke()}
    x.fillStyle=d.col;x.beginPath();x.arc(cx,cy,13,0,7);x.fill();x.fillStyle='#0f1220';x.font='bold 12px system-ui';x.textAlign='center';x.fillText(tw.lvl,cx,cy+4)});
  en.forEach(e=>{x.fillStyle=e.slow>0?'#6cf0ff':e.col;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#000';x.fillRect(e.x-10,e.y-e.r-6,20,3);x.fillStyle='#6cffa0';x.fillRect(e.x-10,e.y-e.r-6,20*Math.max(0,e.hp/e.maxhp),3)});
  x.fillStyle='#fff';shots.forEach(s=>x.fillRect(s.x-2,s.y-2,4,4));
}
reset();setInterval(()=>{step();draw()},1000/60);
</script></body></html>
