<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title>
<style>
body{margin:0;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:6px 0;font-size:22px}.bar{display:flex;gap:14px;align-items:center;margin:8px 0;flex-wrap:wrap;justify-content:center}
button,select{background:#6c8cff;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
#g{display:grid;gap:8px;grid-template-columns:repeat(var(--n),var(--s))}
.card{width:var(--s);height:var(--s);perspective:600px;cursor:pointer}.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.f .in{transform:rotateY(180deg)}.face,.back{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:calc(var(--s)*.5)}
.back{background:linear-gradient(135deg,#2a3270,#4a2a70);border:2px solid #6c8cff}.face{background:#1a1e33;transform:rotateY(180deg);border:2px solid #2a3050}.card.m .face{border-color:#6cffa0;background:#1c3a2a}
#msg{height:24px;color:#ffe45c;font-weight:600}
</style></head><body>
<h1>🧠 Memory Match</h1>
<div class="bar"><select id="d"><option value="4,3">Easy (4×3)</option><option value="4,4" selected>Medium (4×4)</option><option value="6,5">Hard (6×5)</option></select><button id="new">New game</button><span id="mv">Moves: 0</span><span id="tm">Time: 0s</span></div>
<div id="msg"></div><div id="g"></div>
<script>
const EM=['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🐙','🦄','🐢','🍎','🍕','🚀','⚽','🎸','🌵','🍩','🎲','🌈','⭐'];
let first=null,lock=false,moves=0,pairs=0,total=0,t0=0,timer=null;const G=document.getElementById('g'),msg=document.getElementById('msg');
function newGame(){const [c,r]=document.getElementById('d').value.split(',').map(Number);total=c*r/2;const a=EM.slice().sort(()=>Math.random()-.5).slice(0,total);const deck=[...a,...a].sort(()=>Math.random()-.5);
  moves=0;pairs=0;first=null;lock=false;msg.textContent='';document.getElementById('mv').textContent='Moves: 0';clearInterval(timer);t0=0;document.getElementById('tm').textContent='Time: 0s';
  const s=Math.max(54,Math.min(96,Math.floor((Math.min(innerWidth,560)-30-c*8)/c)));G.style.setProperty('--n',c);G.style.setProperty('--s',s+'px');G.innerHTML='';
  deck.forEach(e=>{const d=document.createElement('div');d.className='card';d.dataset.e=e;d.innerHTML='<div class="in"><div class="back"></div><div class="face">'+e+'</div></div>';d.onclick=()=>flip(d);G.appendChild(d)})}
function flip(d){
  if(lock||d.classList.contains('f'))return;
  if(!t0){t0=Date.now();timer=setInterval(()=>document.getElementById('tm').textContent='Time: '+Math.floor((Date.now()-t0)/1000)+'s',500)}
  d.classList.add('f');
  if(!first){first=d;return}
  moves++;document.getElementById('mv').textContent='Moves: '+moves;
  if(first.dataset.e===d.dataset.e){first.classList.add('m');d.classList.add('m');first=null;pairs++;if(pairs===total){clearInterval(timer);msg.textContent='🎉 Done in '+moves+' moves!'}}
  else{lock=true;const a=first;first=null;setTimeout(()=>{a.classList.remove('f');d.classList.remove('f');lock=false},750)}
}
document.getElementById('new').onclick=newGame;document.getElementById('d').onchange=newGame;newGame();
</script></body></html>
