<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkers</title>
<style>
body{margin:0;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:6px 0;font-size:22px}.bar{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap;justify-content:center}
button,select{background:#6c8cff;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
#b{display:grid;grid-template-columns:repeat(8,var(--s));border:3px solid #6c8cff;border-radius:6px}
.q{width:var(--s);height:var(--s);display:flex;align-items:center;justify-content:center;box-sizing:border-box}.q.l{background:#c9b48a}.q.d{background:#4a3a2a}.q.sel{background:#6c8cff}.q.mv{background:#3a6a3a;cursor:pointer}
.p{width:76%;height:76%;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.4);color:#ffe45c}.p.r{background:#ff5c7a}.p.b{background:#222}
#msg{height:26px;font-weight:600;color:#ffe45c;margin:6px}
</style></head><body>
<h1>Checkers</h1>
<div class="bar"><select id="m"><option value="cpu">vs Computer (you are red)</option><option value="two">2 players</option></select><button id="new">New game</button></div>
<div id="msg"></div><div id="b"></div>
<script>
// pieces: 'r','R' (red, moves up) and 'b','B' (black, moves down); uppercase = king
let bd,turn,sel,chain,done;const B=document.getElementById('b'),msg=document.getElementById('msg');
const own=(p,t)=>p&&p.toLowerCase()===t;
function init(){bd=Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>(r+c)%2?(r<3?'b':r>4?'r':''):''));turn='r';sel=null;chain=null;done=false;msg.textContent='Red to move';draw()}
function dirs(p){return p===p.toUpperCase()?[[-1,-1],[-1,1],[1,-1],[1,1]]:(p==='r'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]])}
function inb(r,c){return r>=0&&r<8&&c>=0&&c<8}
function jumps(b,r,c){const p=b[r][c],o=[];for(const[dr,dc]of dirs(p)){const mr=r+dr,mc=c+dc,lr=r+2*dr,lc=c+2*dc;if(inb(lr,lc)&&b[mr][mc]&&b[mr][mc].toLowerCase()!==p.toLowerCase()&&!b[lr][lc])o.push({r:lr,c:lc,cap:[mr,mc]})}return o}
function steps(b,r,c){const p=b[r][c],o=[];for(const[dr,dc]of dirs(p)){const nr=r+dr,nc=c+dc;if(inb(nr,nc)&&!b[nr][nc])o.push({r:nr,c:nc})}return o}
function allMoves(b,t){const j=[],s=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(own(b[r][c],t)){jumps(b,r,c).forEach(m=>j.push({fr:r,fc:c,...m}));steps(b,r,c).forEach(m=>s.push({fr:r,fc:c,...m}))}return j.length?j:s}
function apply(b,m){const p=b[m.fr][m.fc];b[m.fr][m.fc]='';b[m.r][m.c]=p;if(m.cap)b[m.cap[0]][m.cap[1]]='';let k=false;if(p==='r'&&m.r===0){b[m.r][m.c]='R';k=true}if(p==='b'&&m.r===7){b[m.r][m.c]='B';k=true}return k}
function legalFor(r,c){const all=allMoves(bd,turn);let l=all.filter(m=>m.fr===r&&m.fc===c);if(chain)l=l.filter(m=>m.cap);return l}
function draw(){const s=Math.max(34,Math.min(62,Math.floor((Math.min(innerWidth,520)-20)/8)));document.documentElement.style.setProperty('--s',s+'px');B.innerHTML='';
  const lm=sel?legalFor(sel[0],sel[1]):[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const d=document.createElement('div');d.className='q '+((r+c)%2?'d':'l');if(sel&&sel[0]===r&&sel[1]===c)d.classList.add('sel');if(lm.some(m=>m.r===r&&m.c===c))d.classList.add('mv');
    const p=bd[r][c];if(p){const e=document.createElement('div');e.className='p '+p.toLowerCase();if(p===p.toUpperCase())e.textContent='♛';d.appendChild(e)}d.onclick=()=>click(r,c);B.appendChild(d)}}
function click(r,c){
  if(done)return;if(document.getElementById('m').value==='cpu'&&turn==='b')return;
  const lm=sel?legalFor(sel[0],sel[1]):[];const m=lm.find(x=>x.r===r&&x.c===c);
  if(m){doMove(m);return}
  if(chain)return;
  if(own(bd[r][c],turn)&&legalFor(r,c).length)sel=[r,c];else sel=null;draw();
}
function doMove(m){
  const king=apply(bd,m);let more=false;
  if(m.cap&&!king){const j=jumps(bd,m.r,m.c);if(j.length){more=true;sel=[m.r,m.c];chain=true}}
  if(more){draw();if(document.getElementById('m').value==='cpu'&&turn==='b')setTimeout(cpu,350);return}
  chain=null;sel=null;turn=turn==='r'?'b':'r';
  const nm=allMoves(bd,turn);if(!nm.length){done=true;msg.textContent=(turn==='r'?'Black':'Red')+' wins!';draw();return}
  msg.textContent=(turn==='r'?'Red':'Black')+' to move';draw();
  if(document.getElementById('m').value==='cpu'&&turn==='b')setTimeout(cpu,400);
}
function cpu(){
  if(done||turn!=='b')return;let ms=allMoves(bd,'b');if(chain&&sel)ms=ms.filter(m=>m.fr===sel[0]&&m.fc===sel[1]&&m.cap);if(!ms.length)return;
  const sc=m=>{let s=Math.random();if(m.cap)s+=10;if(bd[m.fr][m.fc]==='b'&&m.r===7)s+=5;if(m.r===7||m.c===0||m.c===7)s+=1;
    const t=bd.map(x=>x.slice());apply(t,m);const red=allMoves(t,'r');if(red.some(x=>x.cap))s-=6;return s};
  ms.sort((a,b)=>sc(b)-sc(a));doMove(ms[0]);
}
document.getElementById('new').onclick=init;document.getElementById('m').onchange=init;addEventListener('resize',draw);init();
</script></body></html>
