<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Rocks</title>
<style>html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{background:#080a14;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;max-height:78vh}p{margin:8px;color:#8e94b8;font-size:14px;text-align:center}</style></head><body>
<canvas id="c" width="640" height="480"></canvas>
<p>←/→ rotate, ↑ thrust, Space shoot (A/D/W also work). Press any key to start.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=480;
let ship,rocks,shots,score,lives,state='ready',keys={},cool=0,level,inv;
const R=(a,b)=>a+Math.random()*(b-a);
function spawnRocks(n){rocks=[];for(let i=0;i<n;i++){let px,py;do{px=R(0,W);py=R(0,H)}while(Math.hypot(px-W/2,py-H/2)<120);rocks.push({x:px,y:py,vx:R(-1.5,1.5),vy:R(-1.5,1.5),r:36,a:R(0,6),pts:Array.from({length:10},()=>R(.75,1.15))})}}
function newGame(){ship={x:W/2,y:H/2,vx:0,vy:0,a:-Math.PI/2};shots=[];score=0;lives=3;level=1;inv=120;spawnRocks(4);state='play'}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();if(state!=='play')newGame()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('click',()=>{if(state!=='play')newGame()});
function split(r){if(r.r>14){for(let i=0;i<2;i++)rocks.push({x:r.x,y:r.y,vx:R(-2.2,2.2),vy:R(-2.2,2.2),r:r.r/2,a:R(0,6),pts:r.pts})}}
function wrap(o){o.x=(o.x+W)%W;o.y=(o.y+H)%H}
function step(){
  if(state!=='play')return;
  if(keys['arrowleft']||keys['a'])ship.a-=.075;if(keys['arrowright']||keys['d'])ship.a+=.075;
  if(keys['arrowup']||keys['w']){ship.vx+=Math.cos(ship.a)*.12;ship.vy+=Math.sin(ship.a)*.12}
  ship.vx*=.99;ship.vy*=.99;ship.x+=ship.vx;ship.y+=ship.vy;wrap(ship);
  cool--;if(keys[' ']&&cool<=0){shots.push({x:ship.x,y:ship.y,vx:Math.cos(ship.a)*7+ship.vx,vy:Math.sin(ship.a)*7+ship.vy,t:60});cool=12}
  shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.t--;wrap(s)});shots=shots.filter(s=>s.t>0);
  rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.a+=.01;wrap(r)});
  for(const s of shots){for(const r of rocks){if(!r.dead&&Math.hypot(s.x-r.x,s.y-r.y)<r.r){r.dead=true;s.t=0;score+=r.r>30?20:r.r>20?50:100;split(r);break}}}
  rocks=rocks.filter(r=>!r.dead);
  if(inv>0)inv--;else for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+8){lives--;inv=150;ship.x=W/2;ship.y=H/2;ship.vx=ship.vy=0;if(lives<=0)state='over';break}}
  if(!rocks.length){level++;spawnRocks(3+level);inv=120}
}
function draw(){
  x.fillStyle='#080a14';x.fillRect(0,0,W,H);
  x.strokeStyle='#8e94b8';x.lineWidth=2;
  (rocks||[]).forEach(r=>{x.beginPath();r.pts.forEach((p,i)=>{const t=i/10*Math.PI*2+r.a;const px=r.x+Math.cos(t)*r.r*p,py=r.y+Math.sin(t)*r.r*p;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.stroke()});
  x.fillStyle='#fff';(shots||[]).forEach(s=>x.fillRect(s.x-1.5,s.y-1.5,3,3));
  if(ship&&state!=='over'&&(inv%10<6)){x.save();x.translate(ship.x,ship.y);x.rotate(ship.a);x.strokeStyle='#6c8cff';x.beginPath();x.moveTo(14,0);x.lineTo(-10,-9);x.lineTo(-6,0);x.lineTo(-10,9);x.closePath();x.stroke();x.restore()}
  x.fillStyle='#e8ebff';x.font='16px system-ui';x.textAlign='left';x.fillText('Score '+(score||0)+'  Level '+(level||1),10,24);x.textAlign='right';x.fillText('Lives '+(lives||0),W-10,24);
  if(state!=='play'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='30px system-ui';x.fillText(state==='over'?'Game over — '+score:'SPACE ROCKS',W/2,H/2-6);x.font='16px system-ui';x.fillText('Press any key or click to play',W/2,H/2+26)}
}
setInterval(()=>{step();draw()},1000/60);
</script></body></html>
