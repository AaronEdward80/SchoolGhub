<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong</title>
<style>html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{background:#141830;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;max-height:74vh;touch-action:none}p{margin:8px;color:#8e94b8;font-size:14px;text-align:center}button{background:#6c8cff;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;margin-bottom:8px}</style></head><body>
<button id="mode">Mode: 1 Player (vs CPU)</button>
<canvas id="c" width="640" height="400"></canvas>
<p id="hint"></p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=640,H=400,PH=80,$=id=>document.getElementById(id);
let py=160,ay=160,b,sc=[0,0],state='ready',keys={},two=false;
function hint(){$('hint').textContent=two?'Player 1: W / S (or touch the left side). Player 2: ↑ / ↓ (or touch the right side). First to 7 wins. Click or press a key to start.':'Move with mouse/touch, W/S or ↑/↓. First to 7 wins. Click or press a key to start.'}
function serve(d){b={x:W/2,y:H/2,vx:5*d,vy:Math.random()*4-2}}
function reset(){sc=[0,0];serve(1);state='play'}
$('mode').onclick=function(){two=!two;this.textContent=two?'Mode: 2 Players':'Mode: 1 Player (vs CPU)';this.blur();sc=[0,0];serve(1);state='ready';hint()};
hint();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown',' '].includes(k))e.preventDefault();if(e.repeat)return;keys[k]=true;if(state!=='play'&&!['shift','control','alt','meta'].includes(k))reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function aim(e){const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py2=(e.clientY-r.top)*H/r.height-PH/2;if(two&&px>W/2)ay=py2;else py=py2}
c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&two)return;aim(e)});
c.addEventListener('pointerdown',e=>{if(state!=='play')reset();else aim(e)});
function step(){
  if(state!=='play')return;
  if(keys['w'])py-=6;if(keys['s'])py+=6;
  if(two){if(keys['arrowup'])ay-=6;if(keys['arrowdown'])ay+=6}
  else{if(keys['arrowup'])py-=6;if(keys['arrowdown'])py+=6;ay+=Math.max(-3.8,Math.min(3.8,(b.y-PH/2)-ay))}
  py=Math.max(0,Math.min(H-PH,py));ay=Math.max(0,Math.min(H-PH,ay));
  b.x+=b.vx;b.y+=b.vy;
  if(b.y<6){b.y=6;b.vy=Math.abs(b.vy)}if(b.y>H-6){b.y=H-6;b.vy=-Math.abs(b.vy)}
  if(b.vx<0&&b.x<30&&b.x>16&&b.y>py&&b.y<py+PH){b.vx=Math.min(11,-b.vx*1.06);b.vy+=(b.y-(py+PH/2))*0.15;b.x=30}
  if(b.vx>0&&b.x>W-30&&b.x<W-16&&b.y>ay&&b.y<ay+PH){b.vx=Math.max(-11,-b.vx*1.06);b.vy+=(b.y-(ay+PH/2))*0.15;b.x=W-30}
  if(b.x<0){sc[1]++;serve(1)}if(b.x>W){sc[0]++;serve(-1)}
  if(sc[0]>=7||sc[1]>=7)state='over';
}
function draw(){
  x.fillStyle='#141830';x.fillRect(0,0,W,H);
  x.fillStyle='#2a3050';for(let i=0;i<H;i+=24)x.fillRect(W/2-2,i,4,12);
  x.fillStyle='#6c8cff';x.fillRect(16,py,10,PH);x.fillStyle='#ff5c7a';x.fillRect(W-26,ay,10,PH);
  x.fillStyle='#fff';x.beginPath();x.arc(b?b.x:W/2,b?b.y:H/2,6,0,7);x.fill();
  x.font='36px system-ui';x.textAlign='center';x.fillText(sc[0],W/2-60,50);x.fillText(sc[1],W/2+60,50);
  if(state!=='play'){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='28px system-ui';
    x.fillText(state==='over'?(sc[0]>=7?(two?'Player 1 wins!':'You win!'):(two?'Player 2 wins!':'CPU wins')):'PONG',W/2,H/2-10);x.font='16px system-ui';x.fillText('Click or press a key to play',W/2,H/2+25)}
}
serve(1);setInterval(()=>{step();draw()},1000/60);
</script></body></html>
