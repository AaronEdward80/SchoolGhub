<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Shooter</title>
<style>html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{background:#10142a;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;max-height:78vh;cursor:crosshair}p{margin:8px;color:#8e94b8;font-size:13px;text-align:center}</style></head><body>
<canvas id="c" width="720" height="480"></canvas>
<p>WASD / arrows to move, mouse to aim, click or hold to shoot. Clear a wave, pick an upgrade (click or press 1-3). Beat wave 30 to win, or keep going up to wave 150.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=720,H=480;
let me,en=[],bl=[],eb=[],parts=[],rings=[],score=0,wave=0,state='ready',keys={},mx=W/2,my=H/2,down=false,cool=0,hp=5,maxhp=5,inv=0,spawnN=0,spawnT=0,tick=0,up={},kills=0,novaT=0,choices=[],lock=0,banner=0,continued=false,bossPending=false;
const R=(a,b)=>a+Math.random()*(b-a);
const UP=[
 {id:'rate',name:'Rapid Fire',short:'Rapid',desc:'+18% fire rate',max:8},
 {id:'power',name:'Heavy Rounds',short:'Power',desc:'+30% bullet damage',max:10},
 {id:'multi',name:'Multishot',short:'Multi',desc:'+1 bullet per shot',max:4},
 {id:'pierce',name:'Piercing',short:'Pierce',desc:'Bullets pass through +1 enemy',max:4},
 {id:'speed',name:'Swift Boots',short:'Speed',desc:'+10% move speed',max:5},
 {id:'hpmax',name:'Vitality',short:'Vital',desc:'+1 max HP and heal 1',max:6},
 {id:'heal',name:'Field Medic',short:'Medic',desc:'Heal 3 HP now',max:999},
 {id:'armor',name:'Armor',short:'Armor',desc:'Longer invulnerability after a hit',max:4},
 {id:'vamp',name:'Vampiric',short:'Vamp',desc:'Heal 1 HP every few kills',max:4},
 {id:'boom',name:'Explosive Rounds',short:'Boom',desc:'Bullets explode on impact',max:4},
 {id:'nova',name:'Nova',short:'Nova',desc:'Periodic shockwave around you',max:5}];
const lv=id=>up[id]||0,dmg=()=>Math.pow(1.3,lv('power'));
function newGame(){me={x:W/2,y:H/2};en=[];bl=[];eb=[];parts=[];rings=[];score=0;maxhp=5;hp=5;inv=0;up={};kills=0;novaT=0;continued=false;tick=0;state='play';startWave(1)}
function startWave(n){wave=n;spawnN=Math.min(70,5+n*3);spawnT=0;banner=110;bossPending=n%10===0;bl=[];eb=[]}
function offer(){
  let pool=UP.filter(u=>lv(u.id)<u.max&&u.id!=='heal');
  if(hp<maxhp||pool.length<3)pool.push(UP.find(u=>u.id==='heal'));
  pool.sort(()=>Math.random()-.5);choices=pool.slice(0,3);state='upgrade';lock=40}
function pick(i){const u=choices[i];if(!u||lock>0)return;up[u.id]=lv(u.id)+1;if(u.id==='hpmax'){maxhp++;hp++}if(u.id==='heal')hp=Math.min(maxhp,hp+3);startWave(wave+1);state='play'}
function continueGame(){continued=true;offer()}
const card=i=>{const n=choices.length,sx=(W-(n*200+(n-1)*20))/2;return{x:sx+i*220,y:140,w:200,h:200}};
const btn={x:W/2-75,y:H/2+30,w:150,h:46};
function inside(r){return mx>r.x&&mx<r.x+r.w&&my>r.y&&my<r.y+r.h}
function act(){
  if(state==='ready'||state==='over'||state==='final'){if(lock<=0)newGame()}
  else if(state==='upgrade'){choices.forEach((u,i)=>{if(inside(card(i)))pick(i)})}
  else if(state==='win'){if(lock<=0&&inside(btn))continueGame()}
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();
  if(e.ctrlKey||e.metaKey||e.altKey||['shift','control','alt','meta'].includes(k))return;
  if(state==='ready'||state==='over'||state==='final'){if(lock<=0)newGame()}
  else if(state==='upgrade'){if(k==='1'||k==='2'||k==='3')pick(+k-1)}
  else if(state==='win'){if(lock<=0&&(k==='enter'||k===' '))continueGame()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function setPos(cx,cy){const r=c.getBoundingClientRect();mx=(cx-r.left)*W/r.width;my=(cy-r.top)*H/r.height}
c.addEventListener('mousemove',e=>setPos(e.clientX,e.clientY));
c.addEventListener('mousedown',e=>{setPos(e.clientX,e.clientY);down=true;act()});addEventListener('mouseup',()=>down=false);
c.addEventListener('touchstart',e=>{e.preventDefault();setPos(e.touches[0].clientX,e.touches[0].clientY);down=true;act()},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();setPos(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
c.addEventListener('touchend',()=>down=false);
function burst(px,py,col,n){for(let i=0;i<(n||8);i++)parts.push({x:px,y:py,vx:R(-3,3),vy:R(-3,3),t:25,col})}
function hit(e,d){
  if(e.dead)return;e.hp-=d;burst(e.x,e.y,'#ffe45c',3);
  if(e.hp<=0){e.dead=true;kills++;score+=Math.round(e.pts*(1+wave*.05));burst(e.x,e.y,'#ff5c7a',10);const v=lv('vamp');if(v&&kills%Math.max(8,38-6*v)===0&&hp<maxhp)hp++}
}
function hurt(){if(inv>0)return false;hp--;inv=70+25*lv('armor');burst(me.x,me.y,'#6c8cff',12);if(hp<=0){hp=0;state='over';lock=50}return true}
function mkEnemy(){
  const s=Math.floor(R(0,4)),p=s<2?[R(0,W),s?H+10:-10]:[s===2?-10:W+10,R(0,H)];
  const hm=1+wave*.18,sm=1+Math.min(wave,40)*.012,r=Math.random();
  let e={x:p[0],y:p[1],t:'grunt',hp:hm,sp:R(1.15,1.7)*sm,r:10,pts:10,fire:0};
  if(wave>=8&&r<.12){e.t='shooter';e.hp=hm*1.2;e.sp=1.0*sm;e.r=11;e.pts=30;e.fire=R(40,110)}
  else if(wave>=3&&r<.30){e.t='tank';e.hp=hm*4;e.sp=.85*sm;e.r=16;e.pts=50}
  else if(wave>=4&&r<.50){e.t='runner';e.hp=hm*.6;e.sp=2.5*sm;e.r=8;e.pts=15}
  e.mhp=e.hp;return e;
}
function mkBoss(){const hm=1+wave*.18,h=hm*30;return{x:W/2,y:-30,t:'boss',hp:h,mhp:h,sp:.7*(1+Math.min(wave,40)*.012),r:30,pts:500,fire:90}}
function step(){
  if(lock>0)lock--;
  if(state!=='play')return;
  tick++;if(banner>0)banner--;
  let dx=0,dy=0;
  if(keys['a']||keys['arrowleft'])dx--;if(keys['d']||keys['arrowright'])dx++;if(keys['w']||keys['arrowup'])dy--;if(keys['s']||keys['arrowdown'])dy++;
  const sp=3.4*Math.pow(1.1,lv('speed'));
  if(dx||dy){const l=Math.hypot(dx,dy);me.x+=dx/l*sp;me.y+=dy/l*sp}
  me.x=Math.max(12,Math.min(W-12,me.x));me.y=Math.max(12,Math.min(H-12,me.y));
  cool--;
  if((down||keys[' '])&&cool<=0){
    const a=Math.atan2(my-me.y,mx-me.x),n=1+lv('multi');
    for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.14;bl.push({x:me.x,y:me.y,vx:Math.cos(aa)*9,vy:Math.sin(aa)*9,t:60,dmg:dmg(),pierce:lv('pierce'),hit:new Set()})}
    cool=Math.max(3,9/Math.pow(1.18,lv('rate')));
  }
  bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.t--});bl=bl.filter(b=>b.t>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);
  if(bossPending){bossPending=false;en.push(mkBoss())}
  spawnT++;
  if(spawnN>0&&spawnT>=Math.max(8,Math.round(38-wave*.6))){spawnT=0;spawnN--;en.push(mkEnemy())}
  en.forEach(e=>{
    const a=Math.atan2(me.y-e.y,me.x-e.x),d=Math.hypot(me.x-e.x,me.y-e.y);
    if(e.t==='shooter'){
      if(d>230){e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp}else if(d<170){e.x-=Math.cos(a)*e.sp*.6;e.y-=Math.sin(a)*e.sp*.6}
      if(e.x>14&&e.x<W-14&&e.y>14&&e.y<H-14)e.in=1;
      if(e.in){e.x=Math.max(14,Math.min(W-14,e.x));e.y=Math.max(14,Math.min(H-14,e.y))}
      if(--e.fire<=0){e.fire=120;eb.push({x:e.x,y:e.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,t:220})}
    }else{
      e.x+=Math.cos(a)*e.sp;e.y+=Math.sin(a)*e.sp;
      if(e.t==='boss'&&--e.fire<=0){e.fire=140;for(let i=0;i<10;i++){const aa=i/10*6.283+tick*.01;eb.push({x:e.x,y:e.y,vx:Math.cos(aa)*2.6,vy:Math.sin(aa)*2.6,t:240})}}
    }
  });
  eb.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.t--;if(Math.hypot(b.x-me.x,b.y-me.y)<12&&inv<=0){hurt();b.t=0}});
  eb=eb.filter(b=>b.t>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(const b of bl){
    if(b.t<=0)continue;
    for(const e of en){
      if(e.dead||b.hit.has(e))continue;
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+3){
        hit(e,b.dmg);b.hit.add(e);
        const bm=lv('boom');
        if(bm){const rad=34+12*bm;rings.push({x:b.x,y:b.y,r:0,max:rad,col:'#ffa45c'});for(const o of en)if(o!==e&&!o.dead&&Math.hypot(o.x-b.x,o.y-b.y)<rad+o.r)hit(o,b.dmg*.6)}
        if(b.pierce>0)b.pierce--;else{b.t=0;break}
      }
    }
  }
  const nv=lv('nova');
  if(nv){novaT++;if(novaT>=Math.max(110,380-45*nv)){novaT=0;rings.push({x:me.x,y:me.y,r:0,max:140,col:'#6cffa0'});for(const e of en)if(Math.hypot(e.x-me.x,e.y-me.y)<140+e.r)hit(e,dmg()*2)}}
  en=en.filter(e=>!e.dead);
  if(inv>0)inv--;
  else for(const e of en){if(Math.hypot(me.x-e.x,me.y-e.y)<e.r+10){if(hurt()&&e.t!=='boss')e.dead=true;break}}
  en=en.filter(e=>!e.dead);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.t--});parts=parts.filter(p=>p.t>0);
  rings.forEach(r=>r.r+=6);rings=rings.filter(r=>r.r<r.max);
  if(state==='play'&&spawnN===0&&!bossPending&&!en.length){
    if(wave>=150){state='final';lock=60}
    else if(wave===30&&!continued){state='win';lock=60}
    else offer();
  }
}
function wrap(t,mw){const ws=t.split(' ');let l='',o=[];for(const w of ws){const s=l?l+' '+w:w;if(x.measureText(s).width>mw&&l){o.push(l);l=w}else l=s}o.push(l);return o}
const COL={grunt:'#ff5c7a',runner:'#ffa45c',tank:'#c56cff',shooter:'#5cd6ff',boss:'#ff3b57'};
function draw(){
  x.fillStyle='#10142a';x.fillRect(0,0,W,H);x.strokeStyle='#181d3a';
  for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
  rings.forEach(r=>{x.globalAlpha=Math.max(0,1-r.r/r.max);x.strokeStyle=r.col;x.lineWidth=3;x.beginPath();x.arc(r.x,r.y,r.r,0,7);x.stroke();x.globalAlpha=1;x.lineWidth=1});
  en.forEach(e=>{
    x.fillStyle=COL[e.t];x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();
    if(e.t==='boss'){x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.lineWidth=1}
    if(e.t==='tank'||e.t==='boss'){x.fillStyle='#000a';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);x.fillStyle='#6cffa0';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.mhp),4)}
  });
  x.fillStyle='#ff9a5c';eb.forEach(b=>{x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});
  x.fillStyle='#ffe45c';bl.forEach(b=>{x.beginPath();x.arc(b.x,b.y,3,0,7);x.fill()});
  parts.forEach(p=>{x.globalAlpha=p.t/25;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3);x.globalAlpha=1});
  if(me&&state!=='over'&&(inv%8<5)){x.fillStyle='#6c8cff';x.beginPath();x.arc(me.x,me.y,10,0,7);x.fill();const a=Math.atan2(my-me.y,mx-me.x);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(me.x,me.y);x.lineTo(me.x+Math.cos(a)*18,me.y+Math.sin(a)*18);x.stroke();x.lineWidth=1}
  x.fillStyle='#e8ebff';x.font='16px system-ui';x.textAlign='left';x.fillText('Score '+score+'   Wave '+wave+(wave>=30?'':' / 30'),10,22);
  x.textAlign='right';x.fillText('HP '+'♥'.repeat(Math.max(0,hp))+'♡'.repeat(Math.max(0,maxhp-hp)),W-10,22);
  const owned=UP.filter(u=>u.id!=='heal'&&lv(u.id)>0).map(u=>u.short+' '+lv(u.id));
  x.font='11px system-ui';x.textAlign='left';x.fillStyle='#8e94b8';x.fillText(owned.join('  ·  '),10,H-8);
  if(state==='play'&&banner>0){x.globalAlpha=Math.min(1,banner/40);x.fillStyle='#fff';x.textAlign='center';x.font='32px system-ui';x.fillText('Wave '+wave+(wave%10===0?' - BOSS':''),W/2,90);x.globalAlpha=1}
  if(state==='play')return;
  x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';
  if(state==='ready'){x.font='30px system-ui';x.fillText('ARENA SHOOTER',W/2,H/2-6);x.font='16px system-ui';x.fillText('Press any key or click to play',W/2,H/2+26)}
  else if(state==='over'){x.font='30px system-ui';x.fillText('Game over',W/2,H/2-24);x.font='18px system-ui';x.fillText('Reached wave '+wave+' - Score '+score,W/2,H/2+8);x.font='16px system-ui';x.fillStyle=lock>0?'#666':'#fff';x.fillText('Press any key or click to play again',W/2,H/2+40)}
  else if(state==='final'){x.font='32px system-ui';x.fillText('LEGENDARY! Wave 150 cleared',W/2,H/2-24);x.font='18px system-ui';x.fillText('Final score '+score,W/2,H/2+8);x.font='16px system-ui';x.fillStyle=lock>0?'#666':'#fff';x.fillText('Press any key or click to play again',W/2,H/2+40)}
  else if(state==='win'){
    x.font='34px system-ui';x.fillText('YOU WIN!',W/2,H/2-60);x.font='18px system-ui';x.fillText('You cleared wave 30 - Score '+score,W/2,H/2-26);
    x.fillStyle=lock>0?'#3a4270':(inside(btn)?'#8aa4ff':'#6c8cff');x.fillRect(btn.x,btn.y,btn.w,btn.h);
    x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText('Continue?',W/2,btn.y+30);
    x.fillStyle='#8e94b8';x.font='13px system-ui';x.fillText('Keep going all the way to wave 150',W/2,btn.y+72);
  }
  else if(state==='upgrade'){
    x.font='26px system-ui';x.fillText('Wave '+wave+' cleared - choose an upgrade',W/2,100);
    choices.forEach((u,i)=>{
      const r=card(i),hov=inside(r)&&lock<=0;
      x.fillStyle=hov?'#2a3270':'#1a1e33';x.fillRect(r.x,r.y,r.w,r.h);x.strokeStyle=hov?'#6c8cff':'#2a3050';x.lineWidth=2;x.strokeRect(r.x,r.y,r.w,r.h);x.lineWidth=1;
      x.fillStyle='#6c8cff';x.font='13px system-ui';x.fillText('['+(i+1)+']',r.x+r.w/2,r.y+24);
      x.fillStyle='#fff';x.font='bold 19px system-ui';x.fillText(u.name,r.x+r.w/2,r.y+58);
      x.fillStyle='#c8ccee';x.font='14px system-ui';wrap(u.desc,r.w-24).forEach((ln,k)=>x.fillText(ln,r.x+r.w/2,r.y+92+k*20));
      x.fillStyle='#ffd65c';x.font='13px system-ui';
      if(u.id!=='heal')x.fillText('Level '+lv(u.id)+' > '+(lv(u.id)+1),r.x+r.w/2,r.y+r.h-20);
      else x.fillText('HP '+hp+'/'+maxhp,r.x+r.w/2,r.y+r.h-20);
    });
  }
}
setInterval(()=>{step();draw()},1000/60);
</script></body></html>
