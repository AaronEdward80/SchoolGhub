<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#1b1f2a;border:2px solid #6c8cff;border-radius:8px;max-width:95vw;max-height:70vh}
  p{margin:10px;color:#aab}
  .speeds{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .speeds span{color:#aab;margin-right:4px}
  .speeds button{background:#242a48;color:#e8ebff;border:2px solid transparent;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
  .speeds button.on{background:#6c8cff;color:#fff}
</style>
</head>
<body>
<div class="speeds"><span>Speed:</span><button data-ms="170">Slow</button><button data-ms="110" class="on">Medium</button><button data-ms="65">Fast</button></div>
<canvas id="c" width="400" height="400"></canvas>
<p id="s">Score: 0 — arrow keys / WASD to move, any key to restart</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=c.width/N;
let snake,dir,next,food,score,alive,timer,ms=110;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;alive=true;place()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function step(){
  if(!alive)return;
  dir=next;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y)){alive=false;return}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;place()}else snake.pop();
}
function draw(){
  x.fillStyle='#1b1f2a';x.fillRect(0,0,c.width,c.height);
  x.fillStyle='#ff5c7a';x.fillRect(food.x*S,food.y*S,S-2,S-2);
  snake.forEach((p,i)=>{x.fillStyle=i?'#6cffa0':'#b6ffd0';x.fillRect(p.x*S,p.y*S,S-2,S-2)});
  document.getElementById('s').textContent=alive?`Score: ${score}`:`Game over! Score: ${score} — press any key`;
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m||k===' ')e.preventDefault();
  if(!alive){reset();return}
  if(m&&(m[0]!==-dir.x||m[1]!==-dir.y))next={x:m[0],y:m[1]}
});
function start(){clearInterval(timer);timer=setInterval(()=>{step();draw()},ms)}
document.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>{
  ms=+b.dataset.ms;document.querySelectorAll('.speeds button').forEach(o=>o.classList.toggle('on',o===b));b.blur();reset();start()});
reset();start();
</script>
</body>
</html>
