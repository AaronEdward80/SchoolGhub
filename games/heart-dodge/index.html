<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart Dodge</title>
<style>html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}canvas{background:#05060d;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;max-height:82vh;touch-action:none}p{margin:8px;color:#8e94b8;font-size:14px;text-align:center}</style></head><body>
<canvas id="c" width="600" height="400"></canvas>
<p>Arrow keys / WASD (hold Shift to move slowly) or drag with mouse/touch. Survive 50 seconds. Attacks come in a random order.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=400,B={x:200,y:150,w:200,h:150},keys={};
const DUR=3000,names=['Raindrops','Crosswinds','Starburst','Hunters','Sweeper','Bouncers'];
let t,hp,inv,h,bl,over,win,started,seg;
function nextSeg(first){
  let p;do{p=Math.floor(Math.random()*6)}while(!first&&p===seg.p);
  const s=t+(first?0:Math.floor(Math.random()*90));
  seg={p,start:s,end:s+180+Math.floor(Math.random()*270)};
}
function init(){t=0;hp=20;inv=0;h={x:B.x+B.w/2,y:B.y+B.h/2};bl=[];over=win=false;started=false;seg={p:-1};nextSeg(true)}
init();
function add(px,py,vx,vy,r,extra){bl.push(Object.assign({x:px,y:py,vx,vy,r:r||5},extra))}
function go(){if(over||win)init();else started=true}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k===' '||k==='enter')go()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=false;
function pt(e){const r=c.getBoundingClientRect();h.x=(e.clientX-r.left)*W/r.width;h.y=(e.clientY-r.top)*H/r.height;clamp()}
c.addEventListener('pointerdown',e=>{if(!started||over||win){go();return}drag=true;pt(e)});
c.addEventListener('pointermove',e=>{if(drag&&started&&!over&&!win)pt(e)});
addEventListener('pointerup',()=>drag=false);
function clamp(){h.x=Math.max(B.x+8,Math.min(B.x+B.w-8,h.x));h.y=Math.max(B.y+8,Math.min(B.y+B.h-8,h.y))}
const pats=[
  lt=>{if(lt%9===0)add(B.x+Math.random()*B.w,B.y-30,0,2.6)},
  lt=>{if(lt%15===0){const l=Math.random()<.5;add(l?B.x-30:B.x+B.w+30,B.y+Math.random()*B.h,l?3:-3,0)}},
  lt=>{if(lt%70===0){const cx=B.x+B.w/2,cy=B.y-40;for(let i=0;i<14;i++){const a=Math.PI*(.1+.8*i/13);add(cx,cy,Math.cos(a)*2.2,Math.sin(a)*2.2)}}},
  lt=>{if(lt%40===0){const sx=Math.random()<.5?B.x-30:B.x+B.w+30,sy=B.y+Math.random()*B.h,a=Math.atan2(h.y-sy,h.x-sx);add(sx,sy,Math.cos(a)*3.2,Math.sin(a)*3.2,6)}},
  lt=>{if(lt%5===0){const a=Math.PI/2+Math.sin(lt*.06)*1.0;add(B.x+B.w/2,B.y-30,Math.cos(a)*2.8,Math.sin(a)*2.8)}},
  lt=>{
    if(lt===0)for(let i=0;i<4;i++){const a=Math.random()*6.283;add(B.x+30+Math.random()*(B.w-60),B.y+30+Math.random()*(B.h-60),Math.cos(a)*2.4,Math.sin(a)*2.4,9,{bounce:1})}
    if(lt%30===0)add(B.x+Math.random()*B.w,B.y-30,0,2.2)}
];
function schedule(){
  if(t>=seg.end){bl=bl.filter(b=>!b.bounce);nextSeg(false)}
  if(t>=seg.start)pats[seg.p](t-seg.start);
}
function step(){
  if(!started||over||win)return;
  const s=keys.shift?1.5:3;
  if(keys.arrowleft||keys.a)h.x-=s;if(keys.arrowright||keys.d)h.x+=s;if(keys.arrowup||keys.w)h.y-=s;if(keys.arrowdown||keys.s)h.y+=s;
  clamp();schedule();t++;if(inv>0)inv--;
  bl.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.bounce){if(b.x<B.x+b.r||b.x>B.x+B.w-b.r)b.vx*=-1;if(b.y<B.y+b.r||b.y>B.y+B.h-b.r)b.vy*=-1}});
  bl=bl.filter(b=>b.bounce||(b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50));
  if(inv<=0)for(const b of bl)if(Math.hypot(b.x-h.x,b.y-h.y)<b.r+4){hp-=4;inv=45;if(hp<=0){hp=0;over=true}break}
  if(t>=DUR){win=true;bl=[]}
}
function heart(cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.9);x.bezierCurveTo(cx-s*1.4,cy-s*.1,cx-s*.7,cy-s*1.2,cx,cy-s*.5);x.bezierCurveTo(cx+s*.7,cy-s*1.2,cx+s*1.4,cy-s*.1,cx,cy+s*.9);x.fill()}
function draw(){
  x.fillStyle='#05060d';x.fillRect(0,0,W,H);
  bl.forEach(b=>{x.fillStyle=b.bounce?'#ffa45c':'#e8ebff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});
  x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(B.x,B.y,B.w,B.h);
  if(!(inv>0&&Math.floor(inv/4)%2)){x.fillStyle='#ff3b57';heart(h.x,h.y,7)}
  x.fillStyle='#2a3050';x.fillRect(150,330,300,14);x.fillStyle='#ffd65c';x.fillRect(150,330,300*hp/20,14);
  x.fillStyle='#e8ebff';x.font='14px system-ui';x.textAlign='left';x.fillText('HP '+hp+'/20',150,358);
  x.textAlign='right';x.fillText(Math.max(0,Math.ceil((DUR-t)/60))+'s left',450,358);
  x.textAlign='center';
  if(started&&!over&&!win){if(t>=seg.start)x.fillText(names[seg.p],W/2,40);x.fillStyle='#2a3050';x.fillRect(150,52,300,6);x.fillStyle='#6c8cff';x.fillRect(150,52,300*t/DUR,6)}
  x.font='24px system-ui';x.fillStyle='#e8ebff';
  if(!started)x.fillText('Press Space or click to begin',W/2,70);
  if(over){x.fillText('You were overwhelmed',W/2,70);x.font='15px system-ui';x.fillText('Press Space or click to try again',W/2,98)}
  if(win){x.fillStyle='#6cffa0';x.fillText('You survived!',W/2,70);x.font='15px system-ui';x.fillStyle='#e8ebff';x.fillText('Press Space or click to play again',W/2,98)}
}
setInterval(()=>{step();draw()},1000/60);
</script></body></html>
