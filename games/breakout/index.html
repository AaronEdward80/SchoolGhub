<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker</title>
<style>html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{background:#141830;border:2px solid #6c8cff;border-radius:8px;max-width:96vw;max-height:78vh}p{margin:8px;color:#8e94b8;font-size:14px;text-align:center}</style></head><body>
<canvas id="c" width="600" height="440"></canvas>
<p>Move with mouse or ←/→ (or A/D). Click or press Space to launch.</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=600,H=440;
let pad,ball,bricks,lives,score,level,state,keys={};
const cols=['#ff5c7a','#ffa45c','#ffe45c','#6cffa0','#6c8cff'];
function build(){bricks=[];const rows=4+Math.min(level,3);for(let r=0;r<rows;r++)for(let i=0;i<10;i++)bricks.push({x:10+i*58,y:50+r*24,w:54,h:20,c:cols[r%5],alive:true})}
function launchReady(){pad={x:W/2-45,w:90};ball={x:W/2,y:H-40,vx:0,vy:0,stuck:true}}
function newGame(){lives=3;score=0;level=1;build();launchReady();state='play'}
function launch(){if(state!=='play'){newGame();return}if(ball.stuck){ball.stuck=false;const s=4+level*0.4;ball.vx=s*0.6;ball.vy=-s}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();if(e.key===' ')launch()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();pad.x=(e.clientX-r.left)*W/r.width-pad.w/2});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();pad.x=(e.touches[0].clientX-r.left)*W/r.width-pad.w/2},{passive:false});
c.addEventListener('click',launch);
function step(){
  if(state!=='play')return;
  if(keys['arrowleft']||keys['a'])pad.x-=8;if(keys['arrowright']||keys['d'])pad.x+=8;
  pad.x=Math.max(0,Math.min(W-pad.w,pad.x));
  if(ball.stuck){ball.x=pad.x+pad.w/2;ball.y=H-40;return}
  ball.x+=ball.vx;ball.y+=ball.vy;
  if(ball.x<6){ball.x=6;ball.vx=Math.abs(ball.vx)}if(ball.x>W-6){ball.x=W-6;ball.vx=-Math.abs(ball.vx)}if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)}
  if(ball.vy>0&&ball.y>H-30&&ball.y<H-16&&ball.x>pad.x&&ball.x<pad.x+pad.w){const o=(ball.x-(pad.x+pad.w/2))/(pad.w/2);const s=Math.hypot(ball.vx,ball.vy);ball.vx=o*s*0.85;ball.vy=-Math.sqrt(Math.max(1,s*s-ball.vx*ball.vx))}
  for(const b of bricks){if(!b.alive)continue;if(ball.x>b.x-6&&ball.x<b.x+b.w+6&&ball.y>b.y-6&&ball.y<b.y+b.h+6){b.alive=false;score+=10;
    const ox=Math.min(ball.x-b.x,b.x+b.w-ball.x),oy=Math.min(ball.y-b.y,b.y+b.h-ball.y);if(ox<oy)ball.vx*=-1;else ball.vy*=-1;break}}
  if(!bricks.some(b=>b.alive)){level++;build();launchReady()}
  if(ball.y>H+10){lives--;if(lives<=0)state='over';else launchReady()}
}
function draw(){
  x.fillStyle='#141830';x.fillRect(0,0,W,H);
  bricks.forEach(b=>{if(b.alive){x.fillStyle=b.c;x.fillRect(b.x,b.y,b.w,b.h)}});
  x.fillStyle='#6c8cff';x.fillRect(pad.x,H-24,pad.w,10);
  x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,6,0,7);x.fill();
  x.fillStyle='#e8ebff';x.font='16px system-ui';x.textAlign='left';x.fillText('Score '+score+'   Level '+level,10,24);x.textAlign='right';x.fillText('Lives '+lives,W-10,24);
  if(state==='over'){x.fillStyle='rgba(0,0,0,.65)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='30px system-ui';x.fillText('Game over — '+score,W/2,H/2);x.font='16px system-ui';x.fillText('Click or press Space to restart',W/2,H/2+30)}
}
newGame();setInterval(()=>{step();draw()},1000/60);
</script></body></html>
