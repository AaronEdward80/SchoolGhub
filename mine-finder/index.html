<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mine Finder</title>
<style>
body{margin:0;background:#0f1220;color:#e8ebff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:6px 0;font-size:22px}.bar{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap;justify-content:center}
button,select{background:#6c8cff;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}button.on{background:#ff5c7a}
#grid{display:grid;gap:2px;background:#0a0c18;padding:4px;border-radius:8px;user-select:none;touch-action:manipulation}
.c{width:var(--s);height:var(--s);background:#2a3050;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--s)*.55);border-radius:3px;cursor:pointer}
.c.o{background:#1a1e33;cursor:default}.c.m{background:#ff5c7a}
.n1{color:#6c8cff}.n2{color:#6cffa0}.n3{color:#ff5c7a}.n4{color:#c56cff}.n5{color:#ffa45c}.n6{color:#6cf0ff}.n7{color:#fff}.n8{color:#aaa}
#msg{height:22px;color:#ffe45c;font-weight:600}
</style></head><body>
<h1>💣 Mine Finder</h1>
<div class="bar"><select id="d"><option value="9,9,10">Easy 9×9</option><option value="12,12,25">Medium 12×12</option><option value="16,16,40">Hard 16×16</option></select><button id="new">New game</button><button id="flag">Flag mode: off</button><span id="info"></span></div>
<div id="msg"></div><div id="grid"></div>
<p style="color:#8e94b8;font-size:13px;text-align:center">Click to reveal. Right-click or use Flag mode to flag mines.</p>
<script>
let R,C,M,cells,over,first,flagMode=false,left;
const g=document.getElementById('grid'),msg=document.getElementById('msg'),info=document.getElementById('info');
function init(){[R,C,M]=document.getElementById('d').value.split(',').map(Number);cells=[];for(let i=0;i<R*C;i++)cells.push({m:false,o:false,f:false,n:0});over=false;first=true;left=M;msg.textContent='';render()}
function nb(i){const r=Math.floor(i/C),c=i%C,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<R&&cc>=0&&cc<C)o.push(rr*C+cc)}return o}
function place(safe){const bad=new Set([safe,...nb(safe)]);let n=0;while(n<M){const i=Math.floor(Math.random()*R*C);if(bad.has(i)||cells[i].m)continue;cells[i].m=true;n++}cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length)}
function reveal(i){const q=[i];while(q.length){const k=q.pop(),c=cells[k];if(c.o||c.f)continue;c.o=true;if(c.n===0&&!c.m)nb(k).forEach(j=>{if(!cells[j].o)q.push(j)})}}
function click(i,flag){
  if(over)return;const c=cells[i];
  if(flag){if(!c.o){c.f=!c.f;left+=c.f?-1:1}render();return}
  if(c.f||c.o)return;
  if(first){place(i);first=false}
  if(c.m){over=true;cells.forEach(x=>{if(x.m)x.o=true});msg.textContent='💥 Boom! Game over.';render();return}
  reveal(i);
  if(cells.every(x=>x.o||x.m)){over=true;msg.textContent='🎉 You cleared the field!';cells.forEach(x=>{if(x.m)x.f=true});left=0}
  render();
}
function render(){
  const s=Math.max(22,Math.min(38,Math.floor((Math.min(innerWidth,560)-40)/C)));
  g.style.setProperty('--s',s+'px');g.style.gridTemplateColumns='repeat('+C+',var(--s))';g.innerHTML='';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='c'+(c.o?' o':'')+(c.o&&c.m?' m':'');
    if(c.o&&c.m)d.textContent='💣';else if(c.o&&c.n){d.textContent=c.n;d.classList.add('n'+c.n)}else if(c.f)d.textContent='🚩';
    d.onclick=()=>click(i,flagMode);d.oncontextmenu=e=>{e.preventDefault();click(i,true)};g.appendChild(d)});
  info.textContent='Mines left: '+left;
}
document.getElementById('new').onclick=init;document.getElementById('d').onchange=init;
document.getElementById('flag').onclick=e=>{flagMode=!flagMode;e.target.textContent='Flag mode: '+(flagMode?'on':'off');e.target.className=flagMode?'on':''};
init();
</script></body></html>
